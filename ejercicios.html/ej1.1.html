<label for  ""> Euros </label>
<input type="text" class="input" />
<button type="button">Euro a dolar</button>
<output> </output>
<script>
  function calculadora() {
    const euro = document.querySelector("input").value;
    const dolar = euro * 2;
    alert(dolar);
    document.querySelector("output").value = dolar
  }
  document.querySelector("button").addEventListener("click", calculadora);
</script>
