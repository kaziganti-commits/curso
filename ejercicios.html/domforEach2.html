<p>¿Que superheroe es más fuerte?</p>
<div><input type="radio" name="first" class="false">Batman</input></div>
<div><input type="radio" name="first" class="true">Superman</input></div>
<p>¿En que consiste el sentido aracnido de Spiderman?</p>
<div>
  <input type="radio" name="second" class="false">
    Puede detectar cuando hay arañas cerca
  </input>
</div>
<div>
  <input type="radio" name="second" class="true">
    Puede detectar cuando hay un peligro cerca
  </input>
</div>
<p>¿Cual es el verdadero nombre de Spiderman?</p>
<div><input type="radio" name="third" class="true">Peter Parker</input></div>
<div><input type="radio" name="third" class="false">Bruce Wayne</input></div>
<button>Comprobar resultado</button>

<script>

document.querySelector("button").addEventListener("click", ()=>{

document.querySelectorAll("input[type=radio]:checked").forEach(input=> {
  if (input.classList.contains("true")) {
    input.closest('div').style.background = 'blue';
  } else {
    input.closest('div').style.background = 'red';
  }
  }
)}
)

</script>
